<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 250" width="100%" height="250">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050A14" />
      <stop offset="50%" stop-color="#081B33" />
      <stop offset="100%" stop-color="#0B2545" />
    </linearGradient>

    <!-- Glowing Text Gradient with Animated Color Shift -->
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF">
        <animate attributeName="stop-color" values="#FFFFFF;#38BDF8;#818CF8;#FFFFFF" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#38BDF8">
        <animate attributeName="stop-color" values="#38BDF8;#818CF8;#FFFFFF;#38BDF8" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#60A5FA">
        <animate attributeName="stop-color" values="#60A5FA;#FFFFFF;#38BDF8;#60A5FA" dur="6s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Wave Gradients -->
    <linearGradient id="wave1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E40AF" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.4" />
    </linearGradient>
    <linearGradient id="wave2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0.3" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="auraFilter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="25" />
    </filter>
  </defs>

  <style>
    .mono { font-family: 'SF Mono', Monaco, 'Courier New', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .title { font-size: 42px; font-weight: 800; letter-spacing: -0.5px; }
    .badge-text { font-size: 11px; font-weight: 700; fill: #38BDF8; letter-spacing: 1.5px; }
    .subtitle { font-size: 15px; fill: #94A3B8; font-weight: 500; }
    .highlight { fill: #38BDF8; font-weight: 700; }
  </style>

  <!-- Card Background -->
  <rect width="848" height="248" x="1" y="1" rx="16" fill="url(#bgGrad)" stroke="#1E3A8A" stroke-width="1.5" />

  <!-- Glowing Aura Circle with Pulse Animation -->
  <circle cx="425" cy="50" r="100" fill="#38BDF8" opacity="0.12" filter="url(#auraFilter)">
    <animate attributeName="r" values="80;120;80" dur="4s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.08;0.18;0.08" dur="4s" repeatCount="indefinite" />
  </circle>

  <!-- Top Status Pill -->
  <g transform="translate(295, 26)">
    <rect width="260" height="26" rx="13" fill="#0E294B" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.4" />
    <circle cx="18" cy="13" r="4" fill="#38BDF8">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="32" y="17" class="sans badge-text">SOFTWARE DEVELOPER &amp; STUDENT</text>
  </g>

  <!-- Main Name Title -->
  <text x="425" y="98" text-anchor="middle" class="sans title" fill="url(#nameGrad)" filter="url(#glow)">Akramul Hasan</text>

  <!-- Subtitle -->
  <text x="425" y="128" text-anchor="middle" class="sans subtitle">Computer Science &amp; Engineering &bull; <tspan class="highlight">BUBT</tspan></text>

  <!-- Animated Rotating Terminal Box -->
  <g transform="translate(175, 148)">
    <rect width="500" height="34" rx="8" fill="#050C1A" stroke="#1E3A8A" stroke-width="1" />
    <circle cx="16" cy="17" r="4" fill="#EF4444" opacity="0.8" />
    <circle cx="30" cy="17" r="4" fill="#F59E0B" opacity="0.8" />
    <circle cx="44" cy="17" r="4" fill="#10B981" opacity="0.8" />
    
    <!-- Text 1 -->
    <text x="65" y="22" class="mono" font-size="12.5" fill="#38BDF8" font-weight="600">
      &gt; Python Desktop &bull; Full-Stack &bull; Creator of EduTrack
      <animate attributeName="opacity" values="1;1;0;0;0;0;1" keyTimes="0;0.3;0.33;0.97;0.98;1;1" dur="9s" repeatCount="indefinite" />
    </text>

    <!-- Text 2 -->
    <text x="65" y="22" class="mono" font-size="12.5" fill="#34D399" font-weight="600">
      &gt; Offline AI &bull; BUBT Trajectory Modeling &bull; Machine Learning
      <animate attributeName="opacity" values="0;0;1;1;0;0;0" keyTimes="0;0.32;0.34;0.64;0.67;1;1" dur="9s" repeatCount="indefinite" />
    </text>

    <!-- Text 3 -->
    <text x="65" y="22" class="mono" font-size="12.5" fill="#A78BFA" font-weight="600">
      &gt; Building Intelligent Academic Tools &bull; Clean Architecture
      <animate attributeName="opacity" values="0;0;0;0;1;1;0" keyTimes="0;0.65;0.67;0.97;0.98;1;1" dur="9s" repeatCount="indefinite" />
    </text>

    <!-- Blinking Cursor -->
    <rect x="470" y="9" width="7" height="15" fill="#38BDF8">
      <animate attributeName="opacity" values="0;1;0" dur="0.8s" repeatCount="indefinite" />
    </rect>
  </g>

  <!-- Waves at Bottom -->
  <path d="M0,230 C200,210 400,245 600,225 C750,210 800,235 850,225 L850,250 L0,250 Z" fill="url(#wave1)" />
  <path d="M0,235 C150,220 350,248 550,230 C700,215 780,240 850,232 L850,250 L0,250 Z" fill="url(#wave2)" />
</svg>
